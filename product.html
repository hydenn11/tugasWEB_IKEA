<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKEA - Detail Produk</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header & Navigasi -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">IKEA</a>
      <ul class="nav-links">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="product.html" class="active">Detail Produk</a></li>
        <li><a href="index.html#kontak">Kontak</a></li>
        <li class="cart-nav-item">
          <a href="javascript:void(0)" title="Keranjang Belanja">
            🛒 Keranjang <span id="cart-badge" class="cart-badge">0</span>
          </a>
        </li>
      </ul>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="container">

    <!-- Navigasi Jejak Dinamis (Breadcrumb) -->
    <div class="breadcrumb">
      <a href="index.html">Beranda</a> &gt; <span id="breadcrumb-category">Furniture</span> &gt; <strong id="breadcrumb-title">Memuat...</strong>
    </div>

    <!-- Kontainer Dinamis Detail Produk (Dimuat via AJAX) -->
    <div id="product-detail-container">
      <div class="loading-box">
        <div class="spinner"></div>
        <p class="loading-text">Mengambil rincian produk via AJAX...</p>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 IKEA Indonesia - Tugas Pemrograman Web (HTML, CSS, JavaScript, jQuery, dan AJAX)</p>
    </div>
  </footer>

  <!-- Toast Notification untuk Keranjang -->
  <div id="toast-notification" class="toast-notification"></div>

  <!-- Library jQuery via CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Script Utama (Implementasi JavaScript, jQuery & AJAX) -->
  <script src="script.js"></script>
</body>

</html>
